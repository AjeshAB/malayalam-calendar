<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>പഞ്ചാംഗം - Malayalam Panchangam</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <h1 class="brand">പഞ്ചാംഗം</h1>
    <p class="brand-sub">Malayalam Panchangam</p>
  </header>

  <section class="toolbar" aria-label="Date navigation">
    <label class="toolbar-label" for="datePicker">തീയതി</label>
    <input type="date" id="datePicker" class="date-input">
    <div class="nav-btns">
      <button type="button" class="nav-btn" id="prevDay">◀ ഇന്നലെ</button>
      <button type="button" class="nav-btn nav-btn-accent" id="today">ഇന്ന്</button>
      <button type="button" class="nav-btn" id="nextDay">നാളെ ▶</button>
      <button type="button" class="nav-btn" id="calToggle">മാസം</button>
      <button type="button" class="nav-btn" id="toolsToggle">ഉപകരണങ്ങൾ</button>
    </div>
  </section>

  <main class="container" id="content">
    <div class="loading">
      <div class="spinner"></div>
      <p>പഞ്ചാംഗം ലോഡ് ചെയ്യുന്നു...</p>
    </div>
  </main>

  <footer class="footer">
    <div>മലയാളം പഞ്ചാംഗം · 2026 · സ്ഥലം: കേരളം (11.07°N, 76.28°E)</div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
